[project]
name = "scs"
version = "0.1.0"
description = "Smart Camera System — retail loss-prevention perception stack"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "numpy>=1.26",
    "redis>=5",
]

[project.optional-dependencies]
# GPU/perception deps are installed per task; see AGENTS.md "Environment".
perception = ["opencv-python-headless>=4.9", "av>=12"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML>=6"]
# Shared GPU stack so every agent gets the same sm_120-capable torch (AGENTS.md "Environment").
# uv resolves these from the CUDA 12.8 wheel index below: uv pip install -e ".[dev,torch]"
torch = ["torch>=2.7", "torchvision>=0.22"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true  # only torch/torchvision come from here

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "gpu: needs a CUDA GPU (skipped in CI)",
    "slow: > 30 s",
    "data: needs datasets under data/ (skipped in CI)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["legacy"]  # reference-only PoC (legacy/README.md)

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
# torch is a per-task GPU dependency (AGENTS.md "Environment"); base.py only needs it for typing.
module = ["torch", "torch.*"]
ignore_missing_imports = true
