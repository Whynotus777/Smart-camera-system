# Install once per clone:  uv tool install pre-commit && pre-commit install
# Run on everything:        pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        exclude: ^legacy/  # reference-only PoC code; not linted (AGENTS.md)

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5120"]  # 5 MB; video, weights and datasets never go in git

  - repo: local
    hooks:
      - id: no-rtsp-credentials
        name: block RTSP URLs with embedded credentials
        description: Camera URLs come from env vars only (docs/SECURITY.md).
        language: pygrep
        # Blocks a literal user:password in an RTSP URL; <user>:<password> placeholders are allowed.
        entry: 'rtsp://[^\s<>:/@]+:[^\s<>@]*@'
        # Fake credential URLs that demonstrate the guardrails (keep in sync with .gitleaks.toml).
        exclude: ^(tests/test_contracts\.py|tasks/T01-hygiene-legacy\.md)$
