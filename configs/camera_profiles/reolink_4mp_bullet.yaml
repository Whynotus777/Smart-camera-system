# Reolink 4MP-class bullet/dome, as used in the Sept-2025 lab PoC.
# Overall verification is `approximation`: main stream + optics are TYPICAL for this
# class, not from the exact model's datasheet. Exception: the sub-stream resolution and
# fps (640x360 @ 20 fps) were MEASURED with ffprobe on the PoC clips in
# tests/fixtures/video/. Those clips are the PoC's re-encode (MPEG-4), so the sub-stream
# codec and bitrate below are NOT measured. T07 owns promotion to spec_sourced/measured.
id: reolink_4mp_bullet
vendor: Reolink
model: "4MP bullet/dome (exact model TBD)"
main_stream: {width: 2560, height: 1440, fps: 15, codec: h264, bitrate_kbps: 6144}
sub_stream: {width: 640, height: 360, fps: 20, codec: h264, bitrate_kbps: 512}
hfov_deg: 87
lens: rectilinear
distortion: [-0.30, 0.10]
ir_night_mode: true
verification: approximation
sources:
  - "ffprobe tests/fixtures/video/demo_1.mp4, demo2.mp4: 640x360, 20 fps (sub-stream size/fps only)"
notes: "Sub-stream width/height/fps measured (see sources); everything else approximate. RTSP paths: /h264Preview_01_main, /h264Preview_01_sub. Some models default main stream to H.265."
